-direction.js?v=14"></script><script src="battle-upgrade.js?v=14"></script><script>document.getElementById('recoverSave').addEventListener('click',function(){if(!confirm('以前の冒険データ（Lv5）を復元しますか？'))return;const recovered={x:13,y:6,level:5,xp:0,hp:62,maxHp:62,mp:22,maxMp:22,atk:22,def:11,gold:182,bossDefeated:true,inBattle:false,inMenu:false,area:'world',dungeonFloor:1,dungeonX:2,dungeonY:1,townX:7,townY:10,weapon:'銅のつるぎ',weaponBonus:3,armor:'なし',armorBonus:0,ownedWeapons:['銅のつるぎ'],ownedArmor:[],openedChests:[],searchedFurniture:[],herbs:0,worldMinutes:540,facing:'down'};localStorage.setItem('astria-save',JSON.stringify(recovered));localStorage.setItem('astria-save-backup',JSON.stringify(recovered));location.reload()});if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/RPG/sw.js',{scope:'/RPG/'}).catch(()=>{}))}</script></body></html>
